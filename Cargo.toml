[workspace]
resolver = "2"
members = ["crates/ooxp", "crates/ooxp-cli", "crates/ooxp-wasm"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace.package]
version = "0.1.7"
edition = "2021"
repository = "https://github.com/gaoyia/office-editor-mcp"

[workspace.dependencies]
zip = { version = "2", default-features = false }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
png = "0.17"
fontdue = "0.9"
